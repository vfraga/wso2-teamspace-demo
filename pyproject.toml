[project]
name = "wso2-teamspace-demo"
version = "0.1.0"
description = "Teamspace B2B CIAM + Agentic AI demo with WSO2 Identity Server 7.2.0"
readme = "README.md"
license = "Apache-2.0"
license-file = "LICENSE"
authors = [
    { name = "Vinicius Fraga", email = "sxvinifp@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1",
    "authlib>=1.7",
    "requests>=2.31",
    "python-dotenv>=1.2",
    "flask-session>=0.8",
    "fastapi>=0.136",
    "uvicorn>=0.49",
    "sqlalchemy>=2.0.50",
    "pyjwt[crypto]>=2.13",
    "httpx>=0.28",
    "google-genai>=2.8",
    "markdown>=3.10",
    # Pinned below 2.0: mcp 2.x replaced the `Server.list_tools()` decorator API
    # that agent/mcp_server.py is built on. 1.28.1 is the floor because earlier
    # 1.x is affected by PYSEC-2026-3483. Migrating to the 2.x API is its own
    # piece of work, not a dependency bump.
    "mcp>=1.28.1,<2",
    # Production WSGI/ASGI server. start.sh uses it only when
    # SERVE_MODE=production; the default demo path still uses flask run +
    # single-process uvicorn.
    "gunicorn>=23",
    # Schema migrations for the Business API. Base.metadata.create_all remains
    # the zero-config path for the demo (DB_AUTO_CREATE); Alembic is what a real
    # deployment uses so schema changes can be applied to an existing database.
    "alembic>=1.13",
    # Rate limiting. Both default to in-memory storage so the demo needs no
    # extra infrastructure, and use REDIS_URL when it is set.
    "flask-limiter>=3.8",
    # Used directly by common/rate_limit.py for the FastAPI services, so it is
    # declared rather than relied on as a flask-limiter transitive.
    "limits>=3.0",
]


[project.optional-dependencies]
# Shared state for the agent, so it can run more than one instance. Optional:
# without it the agent uses its in-process store and the demo works unchanged.
redis = [
    "redis>=5",
]
# Postgres driver for the Business API. DATABASE_URL accepts any SQLAlchemy
# URL; this extra supplies the driver for postgresql+psycopg://.
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "redis>=5",
    "pytest>=8.0",
    "pytest-asyncio>=1.4",
    "pytest-mock>=3.12",
    "pytest-playwright>=0.8",
    "ruff>=0.6",
]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "pytest-mock>=3.12",
    "pytest-playwright>=0.8",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: run live E2E integration tests against WSO2 IS",
]


# Ruff linter — narrow correctness-focused rule set.
#
# Why this set: catches "runtime-only" errors (undefined names, unused
# imports, mutable default args, etc.) without drowning the team in
# stylistic noise. Style rules (line length, whitespace, naming) are
# intentionally OFF — pyproject.toml doesn't enforce them and the
# existing code has accumulated stylistic drift that would dwarf the
# real signal. Add rules as the team gains comfort, not on day 1.
#
# Rule families enabled:
#   F    - pyflakes: undefined names, unused imports, syntax errors
#   E9/F63/F7/F82 - pycodestyle correctness subset: real syntax problems
#   B    - bugbear: common Python bugs (mutable defaults, identity checks)
#
# Run with: `ruff check .`
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".venv",
    "flask_session",
    "__pycache__",
    "scratch",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "F",      # pyflakes (undefined name, unused import)
    "E9",     # pycodestyle runtime errors (SyntaxError, IndentationError)
    "F63",    # invalid-print-syntax, invalid-character
    "F7",     # undefined name in `__all__`, if/while/etc. with invalid type
    "F82",    # local variable referenced before assignment, etc.
    "B",      # bugbear (likely bugs, not stylistic issues)
]
ignore = [
    "B008",   # function call in default argument — common in Flask routes
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to import in non-standard order, use unused fixtures, etc.
"tests/**" = ["F401", "F811"]
# setup_*.py provisioning scripts use subprocess + sys.exit liberally
"setup_*.py" = ["E402"]
