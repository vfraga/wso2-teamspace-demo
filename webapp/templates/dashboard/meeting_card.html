<div class="meeting-card">
    <div class="meeting-info">
        <h3>{{ meeting.topic }}</h3>
        <p class="meeting-time">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            {{ meeting.date }} at {{ meeting.start_time }} ({{ meeting.duration }} min)
        </p>
        <p class="meeting-tz">{{ meeting.time_zone }}</p>
        {% if meeting.actor_user_id %}
        <div style="margin-top: var(--space-2);">
            <span class="badge badge-agent">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 15h3"/><path d="M1 9h3"/><path d="M1 15h3"/></svg>
                Booked by AI Agent
            </span>
        </div>
        {% endif %}
    </div>
    <div class="meeting-actions">
        <a href="{{ url_for('dashboard.edit_form', org_handle=org_handle, meeting_id=meeting.id) }}" class="btn btn-sm btn-outline">Edit</a>
        <form method="POST" action="{{ url_for('dashboard.delete', org_handle=org_handle, meeting_id=meeting.id) }}" style="display:inline">
            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this meeting?')">Delete</button>
        </form>
    </div>
</div>
