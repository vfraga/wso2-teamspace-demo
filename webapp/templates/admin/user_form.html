{% extends "base.html" %}

{% block title %}{{ _t('users_add_user') }} — Teamspace{% endblock %}

{% block content %}
<div class="user-form-page">
    <h1>{{ _t('users_add_user') }}</h1>

    <form method="POST" action="{{ url_for('admin.add_user', org_handle=org_handle) }}">
        <div class="form-row">
            <div>
                <label for="first_name">{{ _t('users_first_name') }}</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div>
                <label for="last_name">{{ _t('users_last_name') }}</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
        </div>

        <label for="email">{{ _t('users_email') }}</label>
        <input type="email" id="email" name="email" required placeholder="user@company.com">

        <label for="password">{{ _t('users_password') }}</label>
        <input type="password" id="password" name="password" required minlength="8">

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ _t('users_create_user') }}</button>
            <a href="{{ url_for('admin.users', org_handle=org_handle) }}" class="btn btn-outline">{{ _t('users_cancel') }}</a>
        </div>
    </form>
</div>
{% endblock %}
