<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <!-- Gradient for Right Branch of T -->
    <linearGradient id="right-grad" x1="28" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Gradient for Left/Top Branch of T -->
    <linearGradient id="left-grad" x1="16" y1="16" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="aura-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Rect base -->
  <rect width="64" height="64" rx="18" fill="url(#bg-grad)"/>
  <rect width="62" height="62" x="1" y="1" rx="17" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
 
  <!-- Sleek, abstract intersecting layers forming a high-end "T" -->
  <g filter="url(#aura-glow)">
    <!-- Horizontal Top Bar of T (split into overlapping sleek blocks) -->
    <path d="M16 18C16 16.8954 16.8954 16 18 16H46C47.1046 16 48 16.8954 48 18V24C48 25.1046 47.1046 26 46 26H18C16.8954 26 16 25.1046 16 24V18Z" fill="url(#left-grad)" opacity="0.9"/>
    
    <!-- Overlapping Vertical Stem of T with subtle bottom curvature -->
    <path d="M28 22H36V46C36 47.1046 35.1046 48 34 48H30C28.8954 48 28 47.1046 28 46V22Z" fill="url(#right-grad)" opacity="0.95"/>
    
    <!-- Central intersection accent node (makes the T feel connected and futuristic) -->
    <circle cx="32" cy="22" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="32" cy="22" r="2.5" fill="#6366F1" />
  </g>
</svg>
